<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="color-scheme" content="light" />
  <meta name="theme-color" content="#001489" />
  <title>Registration QR</title>
  <style>
    :root {
      --bg: #001489;
      --card: #ffffff;
      --text: #13235f;
      --muted: #5f6a94;
      --line: #d9dff3;
      --primary: #001489;
      --accent: #ff8200;
    }
    html {
      color-scheme: light;
    }
    body {
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      background: var(--bg);
      color: var(--text);
      color-scheme: light;
    }
    .page {
      max-width: 720px;
      margin: 0 auto;
      padding: 18px 16px 32px;
    }
    .card {
      background: var(--card);
      color: var(--text);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 18px;
      box-shadow: 0 10px 30px rgba(15, 18, 29, 0.06);
      text-align: center;
    }
    .brandMark {
      text-align: center;
      margin: 2px 0 10px;
    }
    .brandMarkLogo {
      width: min(100%, 415px);
      height: 132px;
      display: inline-block;
      background: #001489;
      -webkit-mask: url("sib-millionaire-lockup.svg") center / contain no-repeat;
      mask: url("sib-millionaire-lockup.svg") center / contain no-repeat;
    }
    h2 { margin: 6px 0 6px; }
    .muted { color: var(--muted); margin-bottom: 16px; }
    .qrIntro { font-size: 13px; }
    #qr {
      background: #fff !important;
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 16px;
      display: inline-block;
      max-width: 100%;
      box-sizing: border-box;
      forced-color-adjust: none;
    }
    #qr canvas, #qr img {
      background: #fff !important;
      filter: none !important;
      forced-color-adjust: none;
      width: 300px;
      max-width: 100%;
      height: auto;
      display: block;
    }
    button {
      margin-top: 14px;
      padding: 12px 16px;
      font-size: 16px;
      cursor: pointer;
      border-radius: 10px;
      border: 1px solid var(--primary);
      background: var(--primary);
      color: #fff;
      box-shadow: inset 0 -3px 0 rgba(255,130,0,0.35);
    }
    .hint { font-size: 13px; color: var(--muted); margin-top: 10px; }
    .btnRow { display: block; width: 100%; }
    .btnRow button { width: 100%; margin-top: 10px; }
    .btnGhost { background: #fff; color: var(--primary); border-color: var(--accent); }
    @media (max-width: 520px) {
      .page { padding: 14px 12px 24px; }
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="card">
      <div class="brandMark">
        <div class="brandMarkLogo" role="img" aria-label="SIB Millionaire"></div>
      </div>
      <h2>Registration QR Code</h2>
      <div class="muted qrIntro">Screenshot this QR code to save it on your phone, then proceed to the registration counter.</div>
      <div id="qr"></div>
      <div class="btnRow">
        <button id="downloadBtn" type="button">Download QR PNG</button>
        <button id="backBtn" type="button" class="btnGhost">Back to Registration</button>
      </div>
      <div class="hint" id="msg"></div>
    </div>
  </div>

  <script src="libs/qrcode.min.js"></script>
  <script src="qr.js"></script>
</body>
</html>
